# Release: pushes to main and manual runs (UI "Run pipeline", `mise run ci:run`)
# publish this commit's server image and API contract to the in-cluster registry and
# release the image by committing its tag to EchoPhase-Project/deploy (Flux
# deploys from there).
# GitHub Actions does the checks (all OSes); this only needs what GitHub
# cannot reach: the registry.
#
# Manual-run variables:
#   DEPLOY=false   publish only, do not touch the release
#
# Requires the repository to be "trusted" in Woodpecker (privileged builds)
# and the secret deploy_key (write deploy key of EchoPhase-Project/deploy).

variables:
  # Step image: mise + the tools of mise.lock. `mise run ci:image` updates it.
  - &ci-image localhost:30500/echophase/ci-server:fc9cc3d8dc15
  - &buildkit moby/buildkit:v0.33.0
  # From pipeline pods the registry is its Service; image references in the
  # chart keep localhost:30500, the address the node pulls from.
  - &registry registry.registry.svc:5000

when:
  - event: push
    branch: main
  - event: manual

clone:
  - name: clone
    image: woodpeckerci/plugin-git:2.10.1
    settings:
      # The image tag comes from `git describe`: full history and tags.
      depth: 0
      tags: true

steps:
  - name: image-tag
    image: *ci-image
    commands:
      # Computed first, written after: a file created during the computation
      # would count as an uncommitted change and make the tag "-dirty".
      - TAG=$(mise run -q image-tag)
      - echo "$${TAG}" > .image-tag
      - echo "image tag $${TAG}"

  - name: server-image
    image: *buildkit
    depends_on: [image-tag]
    privileged: true
    environment:
      REGISTRY: *registry
    commands:
      - TAG=$(cat .image-tag)
      - IMAGE=$${REGISTRY}/echophase/server
      - >
        buildctl-daemonless.sh build
        --frontend dockerfile.v0 --local context=src --local dockerfile=src
        --import-cache type=registry,ref=$${IMAGE}:buildcache,registry.insecure=true
        --export-cache type=registry,ref=$${IMAGE}:buildcache,mode=max,registry.insecure=true
        --output "type=image,\"name=$${IMAGE}:$${TAG},$${IMAGE}:latest\",push=true,registry.insecure=true"
    backend_options:
      kubernetes:
        resources:
          requests: { cpu: "1", memory: 2Gi }
          limits: { cpu: "4", memory: 6Gi }

  # Fails on breaking changes within this version's compatibility series
  # (scripts/contract-check.sh); a breaking commit starts the next series.
  - name: openapi
    image: *ci-image
    depends_on: [image-tag]
    environment:
      REGISTRY_API: *registry
    commands:
      - export IMAGE_TAG=$(cat .image-tag)
      - mise run openapi:publish
    backend_options:
      kubernetes:
        resources:
          requests: { cpu: "1", memory: 1Gi }
          limits: { cpu: "4", memory: 4Gi }

  # GitOps: commit the tag to EchoPhase-Project/deploy; Flux upgrades the
  # release from there. The step has no rights in the cluster at all.
  - name: release
    image: *ci-image
    depends_on: [server-image, openapi]
    when:
      - evaluate: 'DEPLOY != "false"'
    environment:
      # Write deploy key of EchoPhase-Project/deploy (Woodpecker secret).
      DEPLOY_KEY:
        from_secret: deploy_key
      GIT_AUTHOR_NAME: Woodpecker CI
      GIT_AUTHOR_EMAIL: ci@echophase.invalid
      GIT_COMMITTER_NAME: Woodpecker CI
      GIT_COMMITTER_EMAIL: ci@echophase.invalid
    commands:
      - mise run release:push

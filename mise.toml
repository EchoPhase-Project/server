# Tool versions for this repository (https://mise.jdx.dev). `mise install`
# installs them; with mise activated in the shell they are on PATH in this
# directory. Versions are the ones the build, tests and deploy were checked with.
[tools]
# Microsoft's SDK build, the same version as Arch's dotnet-sdk 10.0.12.sdk112.
dotnet = "10.0.112"
node = "26.11.1"
helm = "4.3.0"
# Matches the k3s server (v1.36.1).
kubectl = "1.36.1"
oras = "1.3.4"
# Not in mise's registry: taken from the GitHub release.
"github:oasdiff/oasdiff" = "1.32.1"
# Woodpecker's CLI (ci:run, linting .woodpecker/); same version as the server.
"github:woodpecker-ci/woodpecker" = { version = "3.18.1", matching_regex = "^woodpecker-cli_" }

# Exported in this directory (shell with `mise activate`, `mise exec`, tasks).
# Each keeps a value already set in the environment, so one-off overrides work:
#   DOCKER_REGISTRY=registry.example mise run docker:publish
[env]
# Images: the in-cluster registry (infra/registry) and the image names.
DOCKER_REGISTRY = "{{ get_env(name='DOCKER_REGISTRY', default='localhost:30500') }}"
# The same registry as tools reach it: CI pods use registry.registry.svc:5000,
# while image references (pulled by the node) keep DOCKER_REGISTRY.
REGISTRY_API = "{{ get_env(name='REGISTRY_API', default=get_env(name='DOCKER_REGISTRY', default='localhost:30500')) }}"
SERVER_IMAGE = "{{ get_env(name='SERVER_IMAGE', default='echophase/server') }}"
WEBAPP_IMAGE = "{{ get_env(name='WEBAPP_IMAGE', default='echophase/webapp') }}"
OPENAPI_REPO = "{{ get_env(name='OPENAPI_REPO', default='echophase/openapi') }}"
# Helm release; the extra values files are passed only when they exist.
HELM_RELEASE = "{{ get_env(name='HELM_RELEASE', default='echophase') }}"
HELM_NAMESPACE = "{{ get_env(name='HELM_NAMESPACE', default='echophase') }}"
HELM_VALUES = "{{ get_env(name='HELM_VALUES', default='values.k3s.yaml') }}"
HELM_SECRETS = "{{ get_env(name='HELM_SECRETS', default='secrets.yaml') }}"
# kubectl's usual default; k3s's own kubectl would read the root-only
# /etc/rancher/k3s/k3s.yaml.
KUBECONFIG = "{{ get_env(name='KUBECONFIG', default=get_env(name='HOME', default='~') ~ '/.kube/config') }}"
# Woodpecker (mise-tasks/ci.toml). WOODPECKER_SERVER, the OAuth app and the
# CLI token are per machine: mise.local.toml (see mise.local.toml.example).
WOODPECKER_ADMIN_USER = "{{ get_env(name='WOODPECKER_ADMIN_USER', default='CodeHeister') }}"
WOODPECKER_REPO = "{{ get_env(name='WOODPECKER_REPO', default='CodeHeister/EchoPhase') }}"
# Isopoh.Cryptography.Argon2 checkout, built into src/packages (isopoh:pack).
ISOPOH_DIR = "{{ get_env(name='ISOPOH_DIR', default=config_root ~ '/../Isopoh.Cryptography.Argon2/Isopoh.Cryptography.Argon2') }}"

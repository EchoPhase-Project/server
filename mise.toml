# Tool versions for this repository (https://mise.jdx.dev). `mise install`
# installs them; with mise activated in the shell they are on PATH in this
# directory. Versions are the ones the build and tests were checked with.
[tools]
# Microsoft's SDK build, the same version as Arch's dotnet-sdk 10.0.12.sdk112.
dotnet = "10.0.112"
oras = "1.3.4"
# Not in mise's registry: taken from the GitHub release.
"github:oasdiff/oasdiff" = "1.32.1"
# Woodpecker's CLI (ci:run, linting .woodpecker/); same version as the server.
"github:woodpecker-ci/woodpecker" = { version = "3.18.1", matching_regex = "^woodpecker-cli_" }

# Exported in this directory (shell with `mise activate`, `mise exec`, tasks).
# Each keeps a value already set in the environment, so one-off overrides work:
#   DOCKER_REGISTRY=registry.example mise run docker:publish
[env]
# Images: the in-cluster registry (EchoPhase-Project/deploy, infra/registry).
DOCKER_REGISTRY = "{{ get_env(name='DOCKER_REGISTRY', default='localhost:30500') }}"
# The same registry as tools reach it: CI pods use registry.registry.svc:5000,
# while image references (pulled by the node) keep DOCKER_REGISTRY.
REGISTRY_API = "{{ get_env(name='REGISTRY_API', default=get_env(name='DOCKER_REGISTRY', default='localhost:30500')) }}"
SERVER_IMAGE = "{{ get_env(name='SERVER_IMAGE', default='echophase/server') }}"
OPENAPI_REPO = "{{ get_env(name='OPENAPI_REPO', default='echophase/openapi') }}"
# Woodpecker (ci:run): WOODPECKER_SERVER and the token are per machine, in
# mise.local.toml (see mise.local.toml.example).
WOODPECKER_REPO = "{{ get_env(name='WOODPECKER_REPO', default='EchoPhase-Project/server') }}"

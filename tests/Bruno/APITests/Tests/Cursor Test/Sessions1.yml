info:
  name: Sessions1
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/sessions?limit=1"
  params:
    - name: limit
      value: "1"
      type: query
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body["NextCursor"]
        method: jsonq
      variable:
        name: after
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body["Data"][0]["Id"]
        method: jsonq
      variable:
        name: SessionId1
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

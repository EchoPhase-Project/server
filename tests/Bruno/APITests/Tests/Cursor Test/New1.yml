info:
  name: New1
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  headers:
    - name: User-Agent
      value: "{{DeviceId1}}"
  body:
    type: json
    data: |-
      {
        "username": "{{username}}",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.headers["x-csrf-token"]
        method: jsonq
      variable:
        name: X-CSRF-TOKEN
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

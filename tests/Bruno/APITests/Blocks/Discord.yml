info:
  name: Discord
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/blocks/runs"
  headers:
    - name: ""
      value: ""
  body:
    type: json
    data: |-
      {
        "startIds": [
          1
        ],
        "blocks": [
          {
            "id": 1,
            "type": "DiscordGetUserGuilds",
            "params": {
              "name": "guilds",
              "connection": "MyDiscordToken",
              "query": {
                "limit": 100,
                "with_counts": true
              }
            }
          },
          {
            "id": 2,
            "type": "Set",
            "params": {
              "name": "i",
              "value": "0"
            }
          },
          {
            "id": 3,
            "type": "For",
            "params": {
              "counterVar": "j",
              "start": 0,
              "end": 1,
              "step": 1
            }
          },
          {
            "id": 4,
            "type": "Print",
            "params": {
              "text": "Guild #@j: @guilds[j].name (ID: @guilds[j].id)"
            }
          },
          {
            "id": 5,
            "type": "If",
            "params": {
              "condition": "guilds[j].owner"
            }
          },
          {
            "id": 6,
            "type": "Print",
            "params": {
              "text": "  -> You are the owner of @guilds[j].name"
            }
          },
          {
            "id": 7,
            "type": "Set",
            "params": {
              "name": "i",
              "value": "@(i + guilds[j].approximate_member_count)"
            }
          },
          {
            "id": 8,
            "type": "Print",
            "params": {
              "text": "Total members across all guilds: @i"
            }
          }
        ],
        "connections": [
          {
            "from": 1,
            "output": "main",
            "to": 2
          },
          {
            "from": 2,
            "output": "main",
            "to": 3
          },
          {
            "from": 3,
            "output": "body",
            "to": 4
          },
          {
            "from": 3,
            "output": "done",
            "to": 8
          },
          {
            "from": 4,
            "output": "main",
            "to": 5
          },
          {
            "from": 5,
            "output": "true",
            "to": 6
          },
          {
            "from": 5,
            "output": "false",
            "to": 7
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

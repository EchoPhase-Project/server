info:
  name: Discord
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/blocks/run"
  headers:
    - name: ""
      value: ""
  body:
    type: json
    data: |-
      {
        "startIds": [1],
        "blocks": [
          {
            "id": 1,
            "type": "DiscordGetUserGuilds",
            "params": {
              "name": "guilds",
              "token_name": "MyDiscordToken",
              "query": {
                "limit": 100,
                "with_counts": true
              },
              "next": [2]
            }
          },
          {
            "id": 2,
            "type": "Set",
            "params": {
              "name": "i",
              "value": "0",
              "next": [3]
            }
          },
          {
            "id": 3,
            "type": "For",
            "params": {
              "counterVar": "j",
              "start": 0,
              "end": 1,
              "step": 1,
              "bodyNext": [4],
              "afterNext": [8]
            }
          },
          {
            "id": 4,
            "type": "Print",
            "params": {
              "text": "Guild #@j: @guilds[j].name (ID: @guilds[j].id)",
              "next": [5]
            }
          },
          {
            "id": 5,
            "type": "If",
            "params": {
              "condition": "guilds[j].owner",
              "trueNext": [6],
              "falseNext": [7]
            }
          },
          {
            "id": 6,
            "type": "Print",
            "params": {
              "text": "  -> You are the owner of @guilds[j].name",
              "next": []
            }
          },
          {
            "id": 7,
            "type": "Set",
            "params": {
              "name": "i",
              "value": "@(i + guilds[j].approximate_member_count)",
              "next": []
            }
          },
          {
            "id": 8,
            "type": "Print",
            "params": {
              "text": "Total members across all guilds: @i",
              "next": []
            }
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

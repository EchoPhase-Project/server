info:
  name: Define
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/blocks/runs"
  headers:
    - name: ""
      value: ""
  body:
    type: json
    data: |-
      {
        "startIds": [
          1
        ],
        "blocks": [
          {
            "id": 1,
            "type": "Set",
            "params": {
              "name": "user.name",
              "value": "John"
            }
          },
          {
            "id": 2,
            "type": "Set",
            "params": {
              "name": "user.age",
              "value": "30"
            }
          },
          {
            "id": 5,
            "type": "Print",
            "params": {
              "text": "User: @user.name, Age: @user.age"
            }
          }
        ],
        "connections": [
          {
            "from": 1,
            "output": "main",
            "to": 2
          },
          {
            "from": 2,
            "output": "main",
            "to": 5
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

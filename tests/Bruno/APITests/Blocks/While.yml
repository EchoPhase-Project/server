info:
  name: While
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/blocks/runs"
  headers:
    - name: ""
      value: ""
  body:
    type: json
    data: |-
      {
        "startIds": [
          1
        ],
        "blocks": [
          {
            "id": 1,
            "type": "Set",
            "params": {
              "name": "a",
              "value": "1"
            }
          },
          {
            "id": 2,
            "type": "While",
            "params": {
              "condition": "a <= 3"
            }
          },
          {
            "id": 3,
            "type": "Print",
            "params": {
              "text": "a = @a"
            }
          },
          {
            "id": 4,
            "type": "Set",
            "params": {
              "name": "a",
              "value": "@(a + 1)"
            }
          },
          {
            "id": 6,
            "type": "Print",
            "params": {
              "text": "Loop finished"
            }
          }
        ],
        "connections": [
          {
            "from": 1,
            "output": "main",
            "to": 2
          },
          {
            "from": 2,
            "output": "body",
            "to": 3
          },
          {
            "from": 2,
            "output": "done",
            "to": 6
          },
          {
            "from": 3,
            "output": "main",
            "to": 4
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

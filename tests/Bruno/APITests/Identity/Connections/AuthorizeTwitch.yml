info:
  name: AuthorizeTwitch
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/connections/twitch/authorize"
  headers:
    - name: X-CSRF-TOKEN
      value: "{{X-CSRF-TOKEN}}"
  body:
    type: json
    data: |-
      {
        "Name": "{{TwitchConnectionName}}"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body["url"]
        method: jsonq
      variable:
        name: TwitchAuthorizeUrl
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: Start
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/impersonation"
  headers:
    - name: X-CSRF-TOKEN
      value: "{{X-CSRF-TOKEN}}"
  body:
    type: json
    data: |-
      {
        "Username": "{{ImpersonateUsername}}",
        "Reason": "Bruno: support check",
        "Password": "{{password}}"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body["impersonationId"]
        method: jsonq
      variable:
        name: ImpersonationId
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body["accessToken"]
        method: jsonq
      variable:
        name: ImpersonationToken
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

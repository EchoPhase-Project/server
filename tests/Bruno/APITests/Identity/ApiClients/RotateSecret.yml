info:
  name: RotateSecret
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api-clients/{{ClientId}}/secret"
  headers:
    - name: X-CSRF-TOKEN
      value: "{{X-CSRF-TOKEN}}"
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body["clientSecret"]
        method: jsonq
      variable:
        name: ClientSecret
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

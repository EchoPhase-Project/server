name: Publish

# A tag vX.Y.Z publishes the server image and its API contract to GHCR for
# self-hosting (the chart in EchoPhase-Project/charts pins them by version):
#   ghcr.io/echophase-project/server:X.Y.Z   (and latest)
#   ghcr.io/echophase-project/openapi:X.Y.Z  (and latest; webapp builds against it)
# and a GitHub release for the tag, its notes from the commits since the last
# one (scripts/release-notes.sh).
on:
  push:
    tags: [ "v*" ]

permissions:
  # Write: the GitHub release.
  contents: write
  packages: write
  # Build provenance: signed with the workflow's OIDC identity, stored next to
  # the image in GHCR and listed under the org's linked artifacts.
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  MISE_AUTO_INSTALL: "false"
  REGISTRY: ghcr.io/echophase-project

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The release notes read the commits since the previous tag.
          fetch-depth: 0

      - name: Set up tools
        uses: jdx/mise-action@v5
        with:
          install_args: dotnet oras github:oasdiff/oasdiff

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Same rule as the in-cluster pipeline: no breaking change within the
      # release's compatibility series (the version is the tag's: the
      # checkout is shallow, without the history the script would read).
      - name: API contract
        env:
          CONTRACT_VERSION: ${{ github.ref_name }}
        run: |
          mise run openapi
          CONTRACT_VERSION="${CONTRACT_VERSION#v}" scripts/contract-check.sh "$REGISTRY/openapi" artifacts/openapi.json

      - name: Server image
        id: server
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker build -t "$REGISTRY/server:$version" -t "$REGISTRY/server:latest" ./src
          docker push "$REGISTRY/server:$version"
          docker push "$REGISTRY/server:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/server:$version")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Server image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/server
          subject-digest: ${{ steps.server.outputs.digest }}
          push-to-registry: true

      - name: Publish API contract
        id: openapi
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd artifacts
          digest=$(oras push --artifact-type application/vnd.echophase.openapi \
            --annotation "org.opencontainers.image.source=https://github.com/EchoPhase-Project/server" \
            --format go-template='{{.digest}}' \
            "$REGISTRY/openapi:$version" openapi.json:application/vnd.oai.openapi+json)
          oras tag "$REGISTRY/openapi:$version" latest
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: API contract provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/openapi
          subject-digest: ${{ steps.openapi.outputs.digest }}
          push-to-registry: true

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            scripts/release-notes.sh "$GITHUB_REF_NAME"
            echo
            echo "### Published"
            echo
            echo "- Image: \`$REGISTRY/server:$version\`"
            echo "- API contract: \`$REGISTRY/openapi:$version\` (\`oras pull $REGISTRY/openapi:$version\`)"
            echo "- To run it: the Helm chart or Docker Compose in [charts](https://github.com/EchoPhase-Project/charts)."
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "EchoPhase server $version" --notes-file release-notes.md

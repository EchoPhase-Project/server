name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Tools come from mise.toml / mise.lock through jdx/mise-action (it adds
# --locked itself when mise.lock exists), the commands from mise-tasks/: the
# same versions and commands as on a developer machine. Each job installs only
# the tools it needs (install_args); without MISE_AUTO_INSTALL=false,
# `mise run` would fetch every other tool in mise.toml as well.
env:
  MISE_AUTO_INSTALL: "false"

jobs:
  commits:
    name: conventional commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install cocogitto
        uses: cocogitto/cocogitto-action@v4
        with:
          check: false

      # Only the commits this push or PR brings; older history predates cog.
      - name: Check commit messages
        if: github.event_name != 'workflow_dispatch'
        run: cog check "$FROM..$TO"
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}

  # Once, on Linux: Windows checkouts get CRLF line endings, which the
  # whitespace check would flag on every file.
  format:
    name: dotnet format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up tools
        uses: jdx/mise-action@v5
        with:
          install_args: dotnet

      - name: Restore dependencies
        run: dotnet restore EchoPhase.slnx

      - name: Check formatting
        run: mise run lint

  # The whole suite on every OS: tests need no database or Docker (EF InMemory,
  # SQL/CQL translation only). macOS runners are ARM64, so Argon2 runs its
  # portable (non-AVX) path there.
  test:
    name: dotnet test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Codecov upload with OIDC, no token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up tools
        uses: jdx/mise-action@v5
        with:
          install_args: dotnet

      # Coverage once, on Linux: the same code runs everywhere, except the
      # Argon2 SIMD paths, which Linux x64 covers.
      - name: Run tests
        if: runner.os != 'Linux'
        run: mise run test

      - name: Run tests with coverage
        if: runner.os == 'Linux'
        run: mise run test:coverage

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && !cancelled()
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: artifacts/coverage/*.cobertura.xml
          flags: server
          fail_ci_if_error: false

  # The API contract (published with releases, see publish.yml) must export.
  openapi:
    name: OpenAPI document
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up tools
        uses: jdx/mise-action@v5
        with:
          install_args: dotnet

      - name: Export OpenAPI document
        run: mise run openapi


  # The image builds from a clean checkout (Dockerfile, .dockerignore, the
  # local NuGet source in src/packages).
  images:
    name: docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          install: false

      - name: Build the server image
        run: mise run check

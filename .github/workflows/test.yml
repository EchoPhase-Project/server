name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Tools come from mise.toml / mise.lock through jdx/mise-action (it adds
# --locked itself when mise.lock exists), the commands from mise-tasks/: the
# same versions and commands as on a developer machine. Each job installs only
# the tools it needs (install_args); without MISE_AUTO_INSTALL=false,
# `mise run` would fetch every other tool in mise.toml as well.
env:
  MISE_AUTO_INSTALL: "false"

jobs:
  commits:
    name: conventional commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cocogitto
        uses: cocogitto/cocogitto-action@v3
        with:
          check: false

      # Only the commits this push or PR brings; older history predates cog.
      - name: Check commit messages
        if: github.event_name != 'workflow_dispatch'
        run: cog check "$FROM..$TO"
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}

  # Once, on Linux: Windows checkouts get CRLF line endings, which the
  # whitespace check would flag on every file.
  format:
    name: dotnet format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up tools
        uses: jdx/mise-action@v5
        with:
          install_args: dotnet

      - name: Restore dependencies
        run: dotnet restore EchoPhase.slnx

      - name: Check formatting
        run: mise run lint

  # The whole suite on every OS: tests need no database or Docker (EF InMemory,
  # SQL/CQL translation only). macOS runners are ARM64, so Argon2 runs its
  # portable (non-AVX) path there.
  test:
    name: dotnet test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up tools
        uses: jdx/mise-action@v5
        with:
          install_args: dotnet

      - name: Run tests
        run: mise run test

  # The API contract the webapp generates its types from.
  openapi:
    name: OpenAPI document
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up tools
        uses: jdx/mise-action@v5
        with:
          install_args: dotnet

      - name: Export OpenAPI document
        run: mise run openapi

      - name: Upload OpenAPI document
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: artifacts/openapi.json

  webapp:
    name: webapp
    runs-on: ubuntu-latest
    needs: openapi

    defaults:
      run:
        working-directory: webapp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download OpenAPI document
        uses: actions/download-artifact@v4
        with:
          name: openapi
          path: artifacts

      - name: Set up tools
        uses: jdx/mise-action@v5
        with:
          install_args: node

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('webapp/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # Fails when schema.d.ts was not regenerated after an API change.
      - name: Check generated API types
        run: npm run check:api

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # The images build from a clean checkout (Dockerfiles, .dockerignore, the
  # local NuGet source in src/packages).
  images:
    name: docker images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          install: false

      - name: Build server and webapp images
        run: mise run check

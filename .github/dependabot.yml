# Weekly, one grouped PR per ecosystem; minor and patch only for NuGet (major
# upgrades are done by hand). Commit messages pass the conventional-commits
# check (cog).
version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/src", "/tests"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      nuget:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directories: ["/src", "/infra/ci"]
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"

# Woodpecker's own database. The default SQLite locked up under parallel
# steps writing logs; the server's /healthz pings the database, so a locked
# SQLite got the server killed by its liveness probe in the middle of a run.
# Separate from the application's Postgres on purpose.
#
# The password lives in the Secret woodpecker-db (POSTGRES_PASSWORD and the
# server's WOODPECKER_DATABASE_DATASOURCE), created once by woodpecker:install.
apiVersion: v1
kind: Service
metadata:
  name: woodpecker-postgres
  namespace: woodpecker
spec:
  selector:
    app.kubernetes.io/name: woodpecker-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: woodpecker-postgres
  namespace: woodpecker
spec:
  serviceName: woodpecker-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: woodpecker-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: woodpecker-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17
        env:
        - name: POSTGRES_USER
          value: woodpecker
        - name: POSTGRES_DB
          value: woodpecker
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: woodpecker-db
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - name: postgres
          containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "woodpecker", "-d", "woodpecker"]
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 5Gi

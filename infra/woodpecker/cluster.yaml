# Woodpecker CI around the Helm chart (values.yaml): namespaces, limits for
# pipeline pods, the deploy identity, and node-local access for Tailscale.
# Applied by `mise run woodpecker:install` before the chart.
#
#   woodpecker            server (UI, API, SQLite) + agent
#   woodpecker-pipelines  one pod per pipeline step, a PVC per workflow
apiVersion: v1
kind: Namespace
metadata:
  name: woodpecker
---
apiVersion: v1
kind: Namespace
metadata:
  name: woodpecker-pipelines
---
# A build may take a lot, never the whole node the application runs on.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pipelines
  namespace: woodpecker-pipelines
spec:
  hard:
    pods: "12"
    requests.cpu: "6"
    requests.memory: 10Gi
    limits.cpu: "12"
    limits.memory: 16Gi
    requests.storage: 40Gi
---
# Defaults for steps without resources (the quota requires them to be set).
apiVersion: v1
kind: LimitRange
metadata:
  name: pipeline-steps
  namespace: woodpecker-pipelines
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 250m
      memory: 512Mi
    default:
      cpu: "4"
      memory: 4Gi
---
# Identity of the deploy step (backend_options.kubernetes.serviceAccountName):
# it can change the echophase namespace and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: woodpecker-pipelines
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: woodpecker-deployer
  namespace: echophase
subjects:
- kind: ServiceAccount
  name: deployer
  namespace: woodpecker-pipelines
roleRef:
  # Built-in: everything inside one namespace, no cluster-wide rights.
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
---
# The chart has no hostPort: this forwards 127.0.0.1:30800 on the node to the
# server, for `tailscale serve` (UI, API) and `tailscale funnel` (webhooks).
# Bound to 127.0.0.1 only, so the LAN cannot reach Woodpecker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woodpecker-node-port
  namespace: woodpecker
  labels:
    app.kubernetes.io/name: woodpecker-node-port
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: woodpecker-node-port
  template:
    metadata:
      labels:
        app.kubernetes.io/name: woodpecker-node-port
    spec:
      containers:
      - name: socat
        image: alpine/socat:1.8.1.1
        args:
        - TCP-LISTEN:8000,fork,reuseaddr
        - TCP:woodpecker-server.woodpecker.svc:80
        ports:
        - containerPort: 8000
          hostPort: 30800
          hostIP: 127.0.0.1
        resources:
          requests:
            cpu: 10m
            memory: 8Mi
          limits:
            memory: 64Mi

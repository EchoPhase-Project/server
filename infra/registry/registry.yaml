# In-cluster image registry for the local k3s node (cluster infrastructure,
# not part of the EchoPhase chart). Apply with `mise run registry:install`.
#
#   localhost:30500                  docker push/pull on the node, and containerd
#                                    (k3s pulls plain HTTP from localhost)
#   registry.registry.svc:5000       pods, e.g. CI steps that push images
#   http://registry.localhost        read-only web UI (Traefik)
#
# hostPort is bound to 127.0.0.1 only: a NodePort would listen on every node
# address and open unauthenticated pushes to the LAN. For the same reason the
# UI does not proxy the registry: it is a static page whose JavaScript calls
# localhost:30500 from the browser (CORS below), so it works on the node only.
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: registry
data:
  config.yml: |
    version: 0.1
    log:
      level: info
      fields:
        service: registry
    storage:
      filesystem:
        rootdirectory: /var/lib/registry
      cache:
        blobdescriptor: inmemory
      # Lets `mise run registry:prune` delete manifests through the API.
      delete:
        enabled: true
    http:
      addr: :5000
      headers:
        X-Content-Type-Options: [nosniff]
        # For the web UI's requests from the browser.
        Access-Control-Allow-Origin: ['http://registry.localhost']
        Access-Control-Allow-Methods: ['HEAD', 'GET', 'OPTIONS']
        Access-Control-Allow-Headers: ['Authorization', 'Accept', 'Cache-Control']
        Access-Control-Expose-Headers: ['Docker-Content-Digest']
    health:
      storagedriver:
        enabled: true
        interval: 10s
        threshold: 3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
  labels:
    app.kubernetes.io/name: registry
spec:
  replicas: 1
  # One pod owns the RWO volume and the host port: stop the old one first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
      annotations:
        # Restart when the config changes.
        checksum/config: registry-config-v2
    spec:
      containers:
      - name: registry
        image: registry:3.1.1
        args: ["serve", "/etc/distribution/config.yml"]
        ports:
        - name: http
          containerPort: 5000
          hostPort: 30500
          hostIP: 127.0.0.1
        readinessProbe:
          httpGet:
            path: /v2/
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /v2/
            port: http
          periodSeconds: 30
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/registry
        - name: config
          mountPath: /etc/distribution
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: registry-data
      - name: config
        configMap:
          name: registry-config
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  selector:
    app.kubernetes.io/name: registry
  ports:
  - name: http
    port: 5000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-ui
  namespace: registry
  labels:
    app.kubernetes.io/name: registry-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-ui
    spec:
      containers:
      - name: ui
        image: joxit/docker-registry-ui:2.6.0
        env:
        - name: REGISTRY_URL
          value: http://localhost:30500
        - name: REGISTRY_TITLE
          value: EchoPhase registry
        - name: SINGLE_REGISTRY
          value: "true"
        # Deleting here would bypass registry:prune, which keeps every tag a
        # Helm revision still needs.
        - name: DELETE_IMAGES
          value: "false"
        - name: SHOW_CONTENT_DIGEST
          value: "true"
        - name: SHOW_CATALOG_NB_TAGS
          value: "true"
        ports:
        - name: http
          containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: http
        resources:
          requests:
            memory: 16Mi
            cpu: 10m
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: registry-ui
  namespace: registry
spec:
  selector:
    app.kubernetes.io/name: registry-ui
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry-ui
  namespace: registry
spec:
  ingressClassName: traefik
  rules:
  - host: registry.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: registry-ui
            port:
              name: http

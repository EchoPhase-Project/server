# .NET: tests, formatting, the OpenAPI export and the locally built packages.
# Extra arguments go to the last command: `mise run test -- --filter Argon2`.

[test]
description = "Run the .NET tests"
run = "dotnet test --solution EchoPhase.slnx"

["test:coverage"]
description = "Run the .NET tests with coverage: artifacts/coverage/*.cobertura.xml"
run = """
dotnet test --solution EchoPhase.slnx --results-directory artifacts/coverage \
    --coverage --coverage-output-format cobertura \
    --coverage-settings "$PWD/tests/coverage.runsettings"
"""

["coverage:html"]
description = "Coverage report to read: artifacts/coverage/html/index.html (also a summary on stdout)"
depends = ["test:coverage"]
run = [
  "dotnet tool restore",
  "dotnet reportgenerator -reports:'artifacts/coverage/*.cobertura.xml' -targetdir:artifacts/coverage/html -reporttypes:'Html;TextSummary;JsonSummary' -assemblyfilters:'-*.Tests' -classfilters:'-*.Migrations.*'",
  "cat artifacts/coverage/html/Summary.txt | head -12",
]

["test:verbose"]
description = "Run the .NET tests with detailed output"
run = "dotnet test --solution EchoPhase.slnx --output Detailed"

[format]
description = "Apply code style fixes (style first: its fixes may need re-wrapping)"
run = [
  "dotnet format style EchoPhase.slnx",
  "dotnet format whitespace EchoPhase.slnx",
]

[lint]
description = "Fail if formatting or code style would change anything"
run = [
  "dotnet format whitespace EchoPhase.slnx --verify-no-changes",
  "dotnet format style EchoPhase.slnx --verify-no-changes",
]

# Building the host connects to nothing, so no database or configuration is
# needed. Debug, because XML docs are generated only there. Skipped while
# artifacts/openapi.json is newer than every source (`mise run openapi --force`).
[openapi]
description = "Export the API's OpenAPI document to artifacts/openapi.json"
sources = [
  "src/**/*.cs",
  "src/**/*.csproj",
  "src/*.props",
  "!src/**/obj/**",
  "!src/**/bin/**",
]
outputs = ["artifacts/openapi.json"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
dotnet tool restore --tool-manifest src/dotnet-tools.json
dotnet build src/EchoPhase.Server/EchoPhase.Server.csproj -c Debug
mkdir -p artifacts
cd src/EchoPhase.Server
ASPNETCORE_ENVIRONMENT=Development \
    dotnet swagger tofile --output ../../artifacts/openapi.json bin/Debug/net10.0/EchoPhase.Server.dll v1
'''

# Isopoh.Cryptography.Argon2 is built from source (upstream v2 + our patches,
# branch `echophase`): nuget.org still serves the 1.x API as 2.0.0.
["isopoh:pack"]
description = "Pack the Isopoh libraries from a local checkout into src/packages"
usage = '''
flag "--isopoh-dir <dir>" help="Local checkout of Isopoh.Cryptography.Argon2 (branch echophase)" env="ISOPOH_DIR" required=#true
flag "--version <version>" help="Package version" default="2.1.0-echophase.2"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Relative paths count from where mise was called, not the task's directory.
isopoh=$(cd "${MISE_ORIGINAL_CWD:-.}" && realpath "$usage_isopoh_dir")
for p in SecureArray Blake2b Argon2; do
    proj="$isopoh/lib/Isopoh.Cryptography.$p/Isopoh.Cryptography.$p.csproj"
    dotnet build "$proj" -c Release -v q -p:GeneratePackageOnBuild=false
    dotnet pack "$proj" -c Release --no-build -p:PackageVersion="$usage_version" -o src/packages
done
'''

["migrations:add"]
description = "Add a Postgres (EF Core) migration for the current model"
usage = '''
arg "<name>" help="Migration name, e.g. AddWorkflowTags"
'''
run = [
  "dotnet tool restore",
  "dotnet ef migrations add \"$usage_name\" --project src/EchoPhase.DAL.Postgres --startup-project src/EchoPhase.DAL.Postgres",
]

["migrations:check"]
description = "Fail when the Postgres model has changes no migration covers"
run = [
  "dotnet tool restore",
  "dotnet ef migrations has-pending-model-changes --project src/EchoPhase.DAL.Postgres --startup-project src/EchoPhase.DAL.Postgres",
]

["migrations:script"]
description = "Idempotent SQL of all Postgres migrations: artifacts/migrations.sql"
run = [
  "dotnet tool restore",
  "dotnet ef migrations script --idempotent --project src/EchoPhase.DAL.Postgres --startup-project src/EchoPhase.DAL.Postgres --output artifacts/migrations.sql",
]

[clean]
description = "Remove build outputs and artifacts"
run = [
  "rm -rf artifacts/",
  "dotnet clean EchoPhase.slnx -v q",
]

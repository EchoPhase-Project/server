# Flux (GitOps): reconciles the cluster from EchoPhase-Project/deploy.
# Deploys are commits there. Tasks that read the deploy repository take its
# local checkout as --deploy-dir (or DEPLOY_DIR, e.g. in mise.local.toml).

# Installs the controllers, hands Flux the SOPS age key, and applies the
# deploy repo's entry point once; Flux manages clusters/dusty from then on.
["flux:install"]
description = "Install Flux and point it at the deploy repository"
usage = 'flag "--deploy-dir <dir>" help="Local checkout of EchoPhase-Project/deploy" env="DEPLOY_DIR" required=#true'
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Relative paths count from where mise was called, not the task's directory.
deploy=$(cd "${MISE_ORIGINAL_CWD:-.}" && realpath "$usage_deploy_dir")
key="${SOPS_AGE_KEY_FILE:-$HOME/.config/sops/age/keys.txt}"
[ -f "$key" ] || { echo "no age key at $key (age-keygen -o $key)" >&2; exit 1; }
[ -f "$deploy/clusters/dusty/flux.yaml" ] || { echo "no deploy checkout at $deploy" >&2; exit 1; }
flux check --pre
flux install --version="v$(flux --version | awk '{print $3}')"
kubectl -n flux-system create secret generic sops-age \
    --from-file=age.agekey="$key" --dry-run=client -o yaml | kubectl apply -f -
kubectl apply -f "$deploy/clusters/dusty/flux.yaml"
flux reconcile source git deploy -n flux-system
flux get kustomizations -A
'''

["flux:status"]
description = "Sources, kustomizations and Helm releases as Flux sees them"
run = [
  "flux get sources git -A",
  "flux get kustomizations -A",
  "flux get helmreleases -A",
]

["flux:reconcile"]
description = "Pull the deploy repository now instead of waiting for the interval"
run = [
  "flux reconcile source git deploy -n flux-system",
  "flux reconcile kustomization cluster -n flux-system",
  "flux reconcile kustomization echophase -n flux-system",
]

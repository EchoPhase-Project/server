# The server image: build locally, push to $DOCKER_REGISTRY under the image
# tag of this checkout (`mise run image-tag`) and "latest".

["image-tag"]
description = "Print the image tag of this checkout (<version>-g<sha>[-dirty.<time>])"
run = "scripts/image-tag.sh"

["docker:build"]
description = "Build the server image"
run = '''
#!/usr/bin/env bash
set -euo pipefail
. scripts/lib.sh
docker build --build-arg ECHOPHASE_VERSION="$(image_tag)" -t "$SERVER_IMAGE" ./src
'''

["docker:push"]
description = "Tag the built image with the image tag and latest, and push it"
usage = 'flag "--tag <tag>" help="Tag instead of the image tag of this checkout" env="IMAGE_TAG"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
. scripts/lib.sh
tag=${usage_tag:-$(image_tag)}
for t in "$tag" latest; do
    docker tag "$SERVER_IMAGE" "$DOCKER_REGISTRY/$SERVER_IMAGE:$t"
    docker push -q "$DOCKER_REGISTRY/$SERVER_IMAGE:$t"
done
'''

["docker:publish"]
description = "Build and push the server image"
usage = 'flag "--tag <tag>" help="Tag instead of the image tag of this checkout" env="IMAGE_TAG"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run docker:build
mise run docker:push ${usage_tag:+--tag "$usage_tag"}
'''

["docker:info"]
description = "Show the registry, image name and this checkout's image tag"
run = '''
#!/usr/bin/env bash
set -euo pipefail
. scripts/lib.sh
echo "registry:  $DOCKER_REGISTRY"
echo "image:     $DOCKER_REGISTRY/$SERVER_IMAGE:$(image_tag)"
'''

[check]
description = "Build the image, as CI does"
run = "mise run docker:build"

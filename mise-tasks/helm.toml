# Helm release in the local k3s. Every install or upgrade deploys the images
# of this checkout's tag (scripts/lib.sh helm_args): a new tag changes the pod
# spec, so pods roll by themselves, and helm:rollback brings old images back.

["helm:template"]
description = "Render the chart locally, as install/upgrade would"
run = '''
#!/usr/bin/env bash
set -euo pipefail
. scripts/lib.sh
helm_args
helm template "$HELM_RELEASE" helm "${HELM_ARGS[@]}"
'''

["helm:install"]
description = "Install the chart (the images must be published)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
. scripts/lib.sh
check_images
helm_args
helm install "$HELM_RELEASE" helm "${HELM_ARGS[@]}" --create-namespace
'''

["helm:upgrade"]
description = "Upgrade or install the chart (the images must be published)"
usage = 'flag "--reuse-values" help="Keep the values of the previous release instead of helm/*.yaml (CI)"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
. scripts/lib.sh
check_images
helm_args "$([ "${usage_reuse_values:-false}" = true ] && echo reuse)"
helm upgrade --install "$HELM_RELEASE" helm "${HELM_ARGS[@]}" --create-namespace --wait
'''

["helm:diff"]
description = "Dry-run helm:upgrade against the cluster: check before applying"
run = '''
#!/usr/bin/env bash
set -euo pipefail
. scripts/lib.sh
helm_args
helm upgrade --install "$HELM_RELEASE" helm "${HELM_ARGS[@]}" --dry-run=server
'''

["helm:status"]
description = "Status of the release"
run = 'helm status "$HELM_RELEASE" --namespace "$HELM_NAMESPACE"'

["helm:history"]
description = "Revisions of the release (for helm:rollback)"
run = 'helm history "$HELM_RELEASE" --namespace "$HELM_NAMESPACE"'

["helm:rollback"]
description = "Roll back to a revision (default: the previous one)"
usage = 'arg "[revision]" help="Revision; 0 is the previous one" default="0"'
run = 'helm rollback "$HELM_RELEASE" "$usage_revision" --namespace "$HELM_NAMESPACE" --wait'

["helm:uninstall"]
description = "Uninstall the release (data volumes stay)"
confirm = "Uninstall the Helm release?"
run = 'helm uninstall "$HELM_RELEASE" --namespace "$HELM_NAMESPACE" --ignore-not-found'

["helm:delete"]
description = "Uninstall the release and delete its namespace, data volumes included"
confirm = "Delete the namespace and ALL its data?"
run = [
  'helm uninstall "$HELM_RELEASE" --namespace "$HELM_NAMESPACE" --ignore-not-found',
  'kubectl delete namespace "$HELM_NAMESPACE" --ignore-not-found',
]

[rebuild]
description = "Remove local images, reinstall: publish and deploy from scratch"
confirm = "Uninstall the release and redeploy from scratch?"
run = [
  "mise run docker:clean",
  "mise run --yes helm:uninstall",
  "mise run docker:publish",
  "mise run helm:upgrade",
]
